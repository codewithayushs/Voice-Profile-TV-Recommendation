<!DOCTYPE html>
<html>

<head>

<title>Voice Profile Identification</title>

<style>

body{
font-family:Arial;
background:#121212;
color:white;
text-align:center;
padding-top:100px;
}

.container{
background:#1e1e1e;
padding:40px;
border-radius:10px;
width:400px;
margin:auto;
}

button{
padding:10px 20px;
background:#00adb5;
border:none;
color:white;
cursor:pointer;
margin-top:10px;
}

</style>

</head>

<body>

<div class="container">

<h2>AI Voice Profile Identifier</h2>

<form method="POST" enctype="multipart/form-data">

<input type="file" name="audio" required>

<br><br>

<button type="submit">Predict</button>

</form>

{% if prediction %}

<h3>Predicted Gender : {{prediction}}</h3>

{% endif %}

</div>

</body>

</html>

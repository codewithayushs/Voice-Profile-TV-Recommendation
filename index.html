<script>
const SERVER = 'https://voice-profile-tv-recommendation.onrender.com';

const RECS = {
  adult: [
    { title: 'Comedy & Entertainment', items: [
      {e:'😂', name:'Taarak Mehta Ka Ooltah Chashmah', type:'Show', bg:'#2d1a5e', badge:'show'},
      {e:'🎤', name:'Zakir Khan – Sakht Launda', type:'Comedy', bg:'#3b1a4a', badge:'show'},
      {e:'🎭', name:'The Kapil Sharma Show', type:'Show', bg:'#2a1545', badge:'show'},
      {e:'😄', name:'Abhishek Upmanyu Live', type:'Comedy', bg:'#1a2a4a', badge:'show'},
    ]},
    { title: 'Trending Now', items: [
      {e:'🎬', name:'Fukrey Returns', type:'Movie', bg:'#3a1a1a', badge:'movie'},
      {e:'🎭', name:'Gullak', type:'Show', bg:'#2a1a4a', badge:'show'},
      {e:'🎬', name:'Stree 2', type:'Movie', bg:'#3a2a1a', badge:'movie'},
    ]},
  ],
  young: [],
  middle_aged: [
    { title: 'Top Movies For You', items: [
      {e:'🎬', name:'Dil Chahta Hai', type:'Movie', bg:'#3a1a2a', badge:'movie'},
      {e:'🏆', name:'Shershaah', type:'Movie', bg:'#3a2a1a', badge:'movie'},
      {e:'🎬', name:'3 Idiots', type:'Movie', bg:'#1a3a3a', badge:'movie'},
      {e:'🎬', name:'Piku', type:'Movie', bg:'#2a3a1a', badge:'movie'},
    ]},
    { title: 'Must-Watch Series', items: [
      {e:'📺', name:'Scam 1992', type:'Series', bg:'#2a1a4a', badge:'show'},
      {e:'📺', name:'Mirzapur', type:'Series', bg:'#2a1a1a', badge:'show'},
      {e:'📺', name:'Panchayat', type:'Series', bg:'#1a2a1a', badge:'show'},
    ]},
  ],
  senior: [
    { title: 'News & Current Affairs', items: [
      {e:'📰', name:'Aaj Tak – Prime Time', type:'News', bg:'#0a2a1a', badge:'news'},
      {e:'📺', name:'DD News Samachar', type:'News', bg:'#0a1a2a', badge:'news'},
      {e:'🗞️', name:'Zee News Morning', type:'News', bg:'#1a0a2a', badge:'news'},
    ]},
    { title: 'Bhajans & Devotional', items: [
      {e:'🕉️', name:'Hari Om Bhajans', type:'Bhajan', bg:'#2a1a0a', badge:'bhajan'},
      {e:'🙏', name:'Lata Mangeshkar Devotional', type:'Bhajan', bg:'#2a0a1a', badge:'bhajan'},
      {e:'🎵', name:'Shiv Tandav Stotram', type:'Bhajan', bg:'#1a2a0a', badge:'bhajan'},
    ]},
  ],
};
RECS.young = RECS.adult;

function normalizeAgeGroup(age) {
  if (!age) return 'adult';
  age = String(age).toLowerCase().trim();
  if (age === 'young' || age === 'young_adult') return 'adult';
  if (age === 'adult') return 'adult';
  if (age === 'middle-aged' || age === 'middle aged') return 'middle_aged';
  if (age === 'senior') return 'senior';
  return 'adult';
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.getElementById('nav-record').classList.toggle('active', id === 'page-record');
  document.getElementById('nav-result').classList.toggle('active', id === 'page-result');
}

function showToast(msg, dur = 4000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', dur);
}

async function fetchWithTimeout(url, options = {}, timeout = 60000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

async function checkServer() {
  const badge = document.getElementById('serverStatus');
  badge.textContent = '● Waking Render server...';
  badge.className = 'status-badge disconnected';

  try {
    let res = await fetchWithTimeout(SERVER + '/health', {}, 60000);

    if (!res.ok) {
      res = await fetchWithTimeout(SERVER + '/', {}, 60000);
    }

    if (res.ok) {
      badge.textContent = '● Server Connected';
      badge.className = 'status-badge connected';
    } else {
      throw new Error('Server not responding');
    }
  } catch (err) {
    badge.textContent = '● Server Offline';
    badge.className = 'status-badge disconnected';
  }
}

checkServer();
setInterval(checkServer, 30000);

const waveBars = document.querySelectorAll('.wb');
const baseHeights = [8,16,28,42,56,68,76,82,74,62,70,80,72,60,66,78,70,58,64,74,66,50,38,28,20,12,8,5];
let waveTimer = null;

function startWave() {
  document.getElementById('waveform').classList.add('live');
  waveTimer = setInterval(() => {
    waveBars.forEach(b => b.style.height = (4 + Math.random() * 78) + 'px');
  }, 90);
}

function stopWave() {
  clearInterval(waveTimer);
  document.getElementById('waveform').classList.remove('live');
  waveBars.forEach((b, i) => b.style.height = (baseHeights[i] || 8) + 'px');
}

let recording = false, recTimer = null, mediaRecorder = null, chunks = [];

const micBtn = document.getElementById('micBtn');
const recState = document.getElementById('recState');
const timerWrap = document.getElementById('timerWrap');
const timerFill = document.getElementById('timerFill');
const timerLabel = document.getElementById('timerLabel');

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    mediaRecorder = new MediaRecorder(stream);
    chunks = [];

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) chunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      processAudio();
    };

    mediaRecorder.start();

    recording = true;
    micBtn.classList.add('recording');
    recState.textContent = 'Listening... speak clearly';
    timerWrap.style.opacity = '1';
    startWave();

    let elapsed = 0;
    recTimer = setInterval(() => {
      elapsed += 100;
      timerFill.style.width = Math.min(elapsed / 5000 * 100, 100) + '%';
      timerLabel.textContent = Math.min(Math.round(elapsed / 1000), 5) + ' / 5s';

      if (elapsed >= 5000) stopRecording();
    }, 100);

  } catch (e) {
    recState.textContent = 'Microphone access denied';
    showToast('Please allow microphone access in your browser');
    setTimeout(() => recState.textContent = '', 3000);
  }
}

function stopRecording() {
  if (!recording) return;

  recording = false;
  clearInterval(recTimer);
  stopWave();

  micBtn.classList.remove('recording');
  timerWrap.style.opacity = '0';
  recState.textContent = 'Processing your voice...';

  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

micBtn.addEventListener('click', () => {
  if (!recording) startRecording();
  else stopRecording();
});

async function processAudio() {
  const blob = new Blob(chunks, { type: 'audio/webm' });

  showPage('page-analyze');
  startAnalyzeAnimation();

  let gender = 'male';
  let ageGroup = 'adult';
  let gConf = 72;
  let aConf = 65;
  let usingRealModel = false;

  try {
    const formData = new FormData();
    formData.append('audio', blob, 'voice.webm');

    const response = await fetchWithTimeout(SERVER + '/predict', {
      method: 'POST',
      body: formData
    }, 70000);

    if (!response.ok) {
      throw new Error('Server returned ' + response.status);
    }

    const data = await response.json();

    gender = data.gender || 'male';
    ageGroup = normalizeAgeGroup(data.age_group || data.age || 'adult');

    gConf = Math.round((data.gender_conf || data.gender_confidence || 0.72) * 100);
    aConf = Math.round((data.age_conf || data.age_confidence || 0.65) * 100);

    if (gConf <= 1) gConf = Math.round(gConf * 100);
    if (aConf <= 1) aConf = Math.round(aConf * 100);

    usingRealModel = true;
    console.log('Real model prediction:', data);

  } catch (err) {
    console.warn('Render backend not reachable:', err.message);
    showToast('Backend is waking up or offline. Try again after 30–50 seconds.');
  }

  setTimeout(() => {
    showResult(gender, ageGroup, gConf, aConf, usingRealModel);
  }, 2800);
}

function startAnalyzeAnimation() {
  const fill = document.getElementById('progressFill');

  document.querySelectorAll('.step').forEach(s => s.classList.remove('done'));
  fill.style.width = '0%';

  const milestones = [
    { pct: 25, step: 0, delay: 400 },
    { pct: 50, step: 1, delay: 900 },
    { pct: 75, step: 2, delay: 1500 },
    { pct: 100, step: 3, delay: 2200 },
  ];

  milestones.forEach(m => {
    setTimeout(() => {
      fill.style.width = m.pct + '%';
      document.getElementById('s' + m.step).classList.add('done');
    }, m.delay);
  });
}

function showResult(gender, ageGroup, gConf, aConf, real = false) {
  ageGroup = normalizeAgeGroup(ageGroup);

  const ageLabels = {
    adult: 'Adult',
    young: 'Adult',
    middle_aged: 'Middle Aged',
    senior: 'Senior'
  };

  const ageEmoji = {
    adult: '😄',
    young: '😄',
    middle_aged: '🧑',
    senior: '👴'
  };

  const gLabel = String(gender).charAt(0).toUpperCase() + String(gender).slice(1);

  document.getElementById('res-avatar').textContent = ageEmoji[ageGroup] || '👤';
  document.getElementById('res-gender-name').textContent = gLabel;
  document.getElementById('res-age-name').textContent = ageLabels[ageGroup] || ageGroup;
  document.getElementById('res-gender-val').textContent = gLabel;
  document.getElementById('res-age-val').textContent = ageLabels[ageGroup] || ageGroup;

  document.getElementById('res-g-conf').textContent = gConf + '% confidence' + (real ? '' : ' (demo)');
  document.getElementById('res-a-conf').textContent = aConf + '% confidence' + (real ? '' : ' (demo)');

  setTimeout(() => {
    document.getElementById('res-g-bar').style.width = gConf + '%';
    document.getElementById('res-a-bar').style.width = aConf + '%';
  }, 350);

  const right = document.getElementById('resultRight');
  right.innerHTML = '';

  const rows = RECS[ageGroup] || RECS.adult;

  rows.forEach(row => {
    const section = document.createElement('div');
    section.className = 'row-section';

    section.innerHTML = `
      <div class="row-header">
        <div class="row-title">${row.title}</div>
        <div class="row-more">See all →</div>
      </div>
    `;

    const scrollRow = document.createElement('div');
    scrollRow.className = 'scroll-row';

    row.items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'content-card';

      card.innerHTML = `
        <div class="cc-thumb" style="background:${item.bg}">
          <span>${item.e}</span>
          <div class="cc-badge badge-${item.badge}">${item.badge}</div>
        </div>
        <div class="cc-info">
          <div class="cc-name">${item.name}</div>
          <div class="cc-type">${item.type}</div>
        </div>
      `;

      scrollRow.appendChild(card);
    });

    section.appendChild(scrollRow);
    right.appendChild(section);
  });

  showPage('page-result');
}

document.getElementById('nav-record').addEventListener('click', () => {
  recState.textContent = '';
  timerFill.style.width = '0%';
  timerLabel.textContent = '0 / 5s';
  showPage('page-record');
});

document.getElementById('nav-result').addEventListener('click', () => {
  const hasResult = document.getElementById('res-gender-val').textContent !== '—';

  if (hasResult) showPage('page-result');
  else showToast('Record your voice first to see results');
});

document.getElementById('tryAgain').addEventListener('click', () => {
  recState.textContent = '';
  timerFill.style.width = '0%';
  timerLabel.textContent = '0 / 5s';
  showPage('page-record');
});
</script>
